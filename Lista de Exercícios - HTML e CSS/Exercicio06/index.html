<!-- Exercício 6 — Galeria de Fotos 
Crie uma galeria com pelo menos 8 imagens (temas: viagens, animais, natureza, o que preferir).

Estilização (use Grid):

Use display: grid para organizar as imagens em um mosaico de 4 colunas.
Faça pelo menos uma das imagens ocupar o espaço de duas colunas ou duas linhas (dica: pesquise sobre a 
propriedade grid-column e/ou grid-row).
Todas as imagens devem ter o mesmo border-radius e um espaçamento (gap) uniforme entre elas. -->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Fotos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header>
            <h1>Galeria de Fotos</h1>
        </header>

        <div class="galeria">
            <div class="lobinho">
                <img src="https://img.magnific.com/fotos-gratis/lobo-selvagem-na-natureza_23-2151430293.jpg?semt=ais_hybrid&w=740&q=80" alt="lobinho">
            </div>
            <div class="valquiria">
                <img src="https://preview.redd.it/stjkah1efs0g1.jpg?width=640&crop=smart&auto=webp&s=f695aed02614450bf51f617ff91b64ee4425b898" alt="valquiria">
            </div>
            <div class="yingyang">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS912NZNbPLVa8Pq3XyazY4797AVvtHY0-qwHZiFqAAtWGJsvzIr0QHmm_7&s=10" alt="yingyang">
            </div>
            <div class="protecao">
                <img src="https://www.maeperegrina.org.br/wp-content/uploads/2025/10/oracao-157-20210825123103.webp" alt="protecao">
            </div>
            <div class="dayz">
                <img src="https://assets.nuuvem.com/image/upload/t_product_sharing_banner/v1/products/628a60ee48479300174bcd23/sharing_images/o9h0euhbbnctdbsvkhtt.jpg" alt="dayz">
            </div>
            <div class="potter">
                <img src="https://www.quadrorama.com.br/wp-content/uploads/2017/07/47-2.png" alt="potter">
            </div>
            <div class="winx">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRt3avMmrsCx27a61KBVKl9iI5gW5DZZ9ouznS9nfiTqUJ2-LkUKFFU2Qw&s=10" alt="winx">
            </div>
            <div class="metal">
                <img src="https://assets.vogue.com/photos/589149e497a3db337a249684/master/w_2560%2Cc_limit/baby-metal.jpg" alt="metal">
            </div>
        </div>
    </main>
</body>
</html>
